name: Deploy

# Push to master → deploy sbb.orangecat.ch. All the logic lives in one place:
# maonakamoto/fleetcrown/.github/workflows/selfhost-deploy.yml (docs:
# docs/infrastructure/self-host-cd.md there). It waits for this commit's CI to
# go green before anything reaches the box.

on:
  workflow_dispatch: {}
  push:
    branches: [master]

jobs:
  deploy:
    uses: maonakamoto/fleetcrown/.github/workflows/selfhost-deploy.yml@main
    with:
      app: sbb-lost-found
    secrets: inherit
